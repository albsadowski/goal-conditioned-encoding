[project]
name = "goal-conditioned-encoding"
version = "0.1.0"
description = "Goal Conditioned Encoding Experiment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.1",
    "langchain-community>=0.4.1",
    "langchain[openai]>=1.2.3",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "ruff>=0.14.11",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-fireworks>=0.1.0",
    "langchain-openai>=0.1.0",
    "tqdm>=4.66.0",
    "tabulate>=0.9.0",
    "scipy>=1.17.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
